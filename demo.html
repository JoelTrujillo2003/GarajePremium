<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garaje Premium · Demo interactiva</title><style>
:root {
  color-scheme: dark;
  --bg: #10171c;
  --panel: #172127;
  --panel2: #1d2a31;
  --text: #edf3f3;
  --muted: #96a8ae;
  --line: #2b3a41;
  --accent: #b9f582;
  --accentText: #17260c;
  --danger: #ffaaa6;
  --gold: #f4c777;
  --shadow: 0 12px 34px #0002;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f6f3;
  --panel: #fff;
  --panel2: #edf2ed;
  --text: #182a27;
  --muted: #61766d;
  --line: #dbe4df;
  --accent: #c5f39b;
  --accentText: #203314;
  --danger: #a52e28;
  --gold: #966a1e;
  --shadow: 0 12px 34px #1d372609;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font:
    14px "DM Sans",
    sans-serif;
}
h1,
h2,
h3,
.brand {
  font-family: Manrope, sans-serif;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: 0.5;
  cursor: wait;
}
a {
  color: inherit;
}
button:focus-visible,
a:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 4px;
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
h1 {
  font-size: clamp(28px, 3.5vw, 42px);
  line-height: 1.2;
  letter-spacing: -1.4px;
}
h2 {
  font-size: 21px;
  letter-spacing: -0.5px;
}
h3 {
  font-size: 16px;
}
p {
  line-height: 1.7;
}
.muted {
  color: var(--muted);
}
.eyebrow {
  text-transform: uppercase;
  letter-spacing: 2px;
  font-size: 10px;
  font-weight: 800;
  color: var(--accent);
}
.light {
  font-weight: 400;
}
.brand {
  display: flex;
  gap: 11px;
  align-items: center;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.6px;
}
.mark {
  width: 35px;
  height: 35px;
  background: var(--accent);
  color: var(--accentText);
  display: grid;
  place-items: center;
  border-radius: 10px;
  font-size: 21px;
  font-weight: 800;
}
.brand small {
  display: block;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--muted);
  margin-top: 2px;
}
.btn {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 17px;
  background: var(--panel2);
  color: var(--text);
  font-weight: 600;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  transition:
    transform 0.15s,
    filter 0.15s;
}
.btn:hover {
  filter: brightness(1.08);
  transform: translateY(-1px);
}
.btn.primary {
  background: var(--accent);
  color: var(--accentText);
  border-color: var(--accent);
}
.btn.ghost {
  background: transparent;
}
.btn.small {
  padding: 8px 12px;
  font-size: 12px;
}
.btn.danger {
  color: var(--danger);
}
.full {
  width: 100%;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.between {
  justify-content: space-between;
}
.wrap {
  flex-wrap: wrap;
}
.stack {
  display: grid;
  gap: 18px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px;
  box-shadow: var(--shadow);
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: #b9f58215;
  color: var(--accent);
}
:root[data-theme="light"] .tag {
  color: #467627;
}
.tag.gold {
  background: #f4c77712;
  color: var(--gold);
}
.dot {
  width: 6px;
  height: 6px;
  display: inline-block;
  border-radius: 50%;
  background: currentColor;
}
.input,
select,
textarea {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 12px 13px;
  outline: none;
  min-height: 44px;
}
.input:focus,
select:focus,
textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px #b9f58215;
}
label {
  font-size: 12px;
  font-weight: 600;
  display: block;
  margin-bottom: 8px;
}
.field {
  margin-bottom: 17px;
}
.help {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  margin: 6px 0 0;
}
.error {
  font-size: 12px;
  color: var(--danger);
  line-height: 1.6;
  min-height: 18px;
  margin: 8px 0;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}
.icon {
  width: 42px;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 20px;
  background: var(--panel2);
  flex-shrink: 0;
}
.loading {
  display: grid;
  place-items: center;
  min-height: 100vh;
  color: var(--muted);
}
.auth {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  min-height: 100vh;
}
.auth-story {
  background:
    radial-gradient(ellipse at 90% 80%, #3b543333, transparent 60%),
    var(--panel);
  padding: 48px 8%;
  position: relative;
  overflow: hidden;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 55px;
}
.auth-story h1 {
  font-size: clamp(36px, 4.5vw, 64px);
  max-width: 570px;
  line-height: 1.13;
}
.accent {
  color: var(--accent);
}
.auth-story p {
  max-width: 420px;
  color: var(--muted);
  font-size: 16px;
}
.road-art {

  border: 1px solid var(--line);
  border-radius: 16px;

  max-width: 470px;
}
.road-art:before {
  content: "";
  position: absolute;
  width: 440px;
  height: 280px;
  border: 40px solid #52675933;
  border-radius: 50%;
  top: 40px;
  left: 60px;
  transform: rotate(-20deg);
}
.road-art .car {
  position: absolute;
  right: 60px;
  top: 45px;
  font-size: 65px;
  color: #b9f582;
  transform: rotate(-10deg);
}
.road-art .stamp {
  position: absolute;
  left: 20px;
  top: 22px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #b9f582;
}
.auth-form {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 45px 8%;
}
.auth-box {
  width: 100%;
  max-width: 390px;
}
.auth-box h2 {
  font-size: 29px;
  margin-bottom: 9px;
}
.tabs {
  display: flex;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 4px;
  margin: 26px 0;
}
.tabs button {
  flex: 1;
  padding: 11px;
  background: none;
  color: var(--muted);
  border: 0;
  border-radius: 7px;
}
.tabs .active {
  background: var(--panel2);
  color: var(--text);
}
.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 24px 0;
  color: var(--muted);
  font-size: 11px;
}
.divider:before,
.divider:after {
  content: "";
  height: 1px;
  flex: 1;
  background: var(--line);
}
.oauth {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.oauth .btn {
  padding: 11px 6px;
  font-size: 11px;
}
.demo-note {
  border: 1px dashed var(--line);
  border-radius: 9px;
  padding: 12px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
  margin-top: 22px;
}
.auth-footer {
  font-size: 11px;
  color: var(--muted);
  margin-top: 25px;
}
.shell {

  min-height: 100vh;
}
.sidebar {

  background: var(--panel);

  flex-direction: column;
  position: fixed;
  width: 236px;
  height: 100vh;
  z-index: 10;
}
.sidebar .brand {
  margin-bottom: 45px;
}
.nav-title {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin: 0 14px 12px;
}
.nav {
  display: grid;
  gap: 6px;
}
.nav button {
  border: 0;
  text-align: left;
  background: transparent;
  color: var(--muted);
  padding: 13px 14px;
  border-radius: 9px;
  display: flex;
  gap: 13px;
  align-items: center;
}
.nav button.active {
  background: #b9f58210;
  color: var(--accent);
}
:root[data-theme="light"] .nav button.active {
  color: #47732f;
}
.sidebar-bottom {
  margin-top: auto;
}
.membership {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 20px;
}
.membership p {
  font-size: 11px;
  color: var(--muted);
  margin: 10px 0 0;
}
.user {
  padding-top: 18px;
  border-top: 1px solid var(--line);
  gap: 10px;
}
.avatar {
  background: var(--panel2);
  border: 1px solid var(--line);
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 12px;
}
.user-details {
  min-width: 0;
  flex: 1;
}
.user-details strong {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 11px;
}
.main {
  grid-column: 2;
  min-width: 0;
}
.topbar {
  padding: 22px 40px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.breadcrumb {
  font-size: 12px;
  color: var(--muted);
}
.content {
  max-width: 1400px;
  margin: auto;
  padding: 38px 40px;
}
.welcome {
  margin-bottom: 28px;
}
.welcome h1 {
  margin: 7px 0 9px;
  font-size: 33px;
}
.welcome p {
  margin: 0;
  color: var(--muted);
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 26px;
}
.stat {
  padding: 19px 22px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.stat strong {
  font-size: 25px;
  display: block;
  font-family: Manrope;
}
.stat span {
  font-size: 11px;
  color: var(--muted);
}
.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(270px, 1fr);
  gap: 24px;
}
.section-heading {
  margin-bottom: 20px;
}
.section-heading h2 {
  margin: 0;
}
.vehicle-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-bottom: 18px;
  padding-bottom: 3px;
}
.vehicle-tabs button {
  white-space: nowrap;
}
.vehicle-tabs .selected {
  border-color: var(--accent);
  color: var(--accent);
}
:root[data-theme="light"] .vehicle-tabs .selected {
  color: #3a692a;
}
.vehicle-card {
  padding: 25px;
  background:
    radial-gradient(ellipse at 100% 10%, #b9f58210, transparent 65%),
    var(--panel);
}
.vehicle-head h2 {
  font-size: 24px;
  margin: 8px 0;
}
.vehicle-visual {
  margin: 22px 0;
  background: linear-gradient(120deg, #27392f, #1a282d);
  border: 1px solid #354840;
  border-radius: 13px;
  min-height: 160px;
  position: relative;
  overflow: hidden;
  display: grid;
  place-items: center;
}
.vehicle-visual svg {
  width: 76%;
  height: 135px;
  color: #abc0b1;
  filter: drop-shadow(0 12px 10px #0005);
}
.vehicle-visual:after {
  content: "GARAJE / CHILE";
  position: absolute;
  left: 16px;
  bottom: 12px;
  color: #89a596;
  font-size: 8px;
  letter-spacing: 2px;
}
.vehicle-meta {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.vehicle-meta > div {
  border-right: 1px solid var(--line);
}
.vehicle-meta > div:last-child {
  border: 0;
}
.vehicle-meta small {
  color: var(--muted);
  display: block;
  font-size: 10px;
  margin-bottom: 6px;
}
.vehicle-meta strong {
  font-size: 15px;
}
.plan-banner {
  margin: 20px 0;
  background: #b9f58208;
  border: 1px solid #b9f58230;
  border-radius: 12px;
  padding: 20px;
}
.plan-banner h3 {
  margin-bottom: 6px;
}
.plan-banner p {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 15px;
}
.task {
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.task:last-child {
  border-bottom: 0;
}
.task h3 {
  font-size: 13px;
  margin: 0 0 5px;
}
.task p {
  color: var(--muted);
  font-size: 11px;
  margin: 0;
}
.task .check {
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  background: #f4c77712;
  color: var(--gold);
  flex-shrink: 0;
}
.task .task-body {
  flex: 1;
}
.task small {
  color: var(--muted);
  font-size: 10px;
}
.tip {
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}
.tip:last-child {
  border: 0;
}
.tip p {
  font-size: 12px;
  color: var(--muted);
  margin: 5px 0 0;
}
.empty {
  padding: 45px 25px;
  text-align: center;
}
.empty .icon {
  margin: 0 auto 18px;
}
.empty p {
  color: var(--muted);
  max-width: 400px;
  margin: 0 auto 22px;
}
.disclaimer {
  font-size: 10px;
  line-height: 1.6;
  color: var(--muted);
  margin: 16px 0 0;
}
.footer {
  font-size: 10px;
  color: var(--muted);
  margin-top: 35px;
  display: flex;
  justify-content: space-between;
  gap: 15px;
}
.timeline {
  display: grid;
  gap: 14px;
}
.record {
  display: flex;
  gap: 14px;
  padding: 20px;
}
.record h3 {
  margin: 0 0 7px;
}
.record p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}
.record .actions {
  margin-left: auto;
}
.premium-page {
  max-width: 900px;
  margin: 0 auto;
  padding: 45px 25px;
}
.premium-page > h1,
.premium-page > p {
  text-align: center;
}
.pricing {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 25px;
  margin: 35px 0;
}
.price {
  font-size: 44px;
  font-family: Manrope;
  font-weight: 800;
  margin: 25px 0;
}
.price small {
  font-size: 13px;
  color: var(--muted);
  font-weight: 400;
}
.features {
  list-style: none;
  padding: 0;
  display: grid;
  gap: 16px;
  color: var(--muted);
  margin: 25px 0;
}
.features li:before {
  content: "✓";
  margin-right: 12px;
  color: var(--accent);
}
.premium-card {
  border-color: #b9f58260;
  background:
    radial-gradient(ellipse at 100% 0%, #b9f58215, transparent 65%),
    var(--panel);
}
dialog {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 18px;
  max-width: 580px;
  width: calc(100% - 32px);
  padding: 28px;
  max-height: 90vh;
  box-shadow: 0 40px 100px #0008;
}
dialog::backdrop {
  background: #070e12b3;
  backdrop-filter: blur(5px);
}
dialog .modal-head {
  margin-bottom: 23px;
}
dialog h2 {
  margin: 0;
}
.close {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 23px;
  padding: 4px 8px;
}
.modal-footer {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  border-top: 1px solid var(--line);
  padding-top: 20px;
  margin-top: 20px;
}
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  opacity: 0;
  transition: 0.25s;
  background: var(--text);
  color: var(--bg);
  border-radius: 11px;
  box-shadow: var(--shadow);
  padding: 14px 22px;
  max-width: 90vw;
  z-index: 100;
  font-size: 13px;
}
#toast.visible {
  transform: translateX(-50%);
  opacity: 1;
}
.notice {
  padding: 13px 17px;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
  margin-bottom: 20px;
}
.mobile-brand {
  display: none;
}
.theme {
  font-size: 16px;
}
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}
@media (min-width: 1500px) {
  .content {
    padding-top: 45px;
  }
  .auth-story {
    padding: 60px 10%;
  }
}
@media (max-width: 1100px) {
  .shell {
    grid-template-columns: 200px 1fr;
  }
  .sidebar {
    width: 200px;
    padding: 25px 15px;
  }
  .content {
    padding: 28px 24px;
  }
  .topbar {
    padding: 20px 24px;
  }
  .dashboard-grid {
    grid-template-columns: 1fr;
  }
  .right-column {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .right-column > .card {
    margin: 0;
  }
  .auth-story {
    padding: 35px 7%;
  }
}
@media (max-width: 760px) {
  .auth {
    grid-template-columns: 1fr;
  }
  .auth-story {
    padding: 25px;
    gap: 24px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .auth-story h1 {
    font-size: 35px;
    margin-bottom: 12px;
  }
  .auth-story p {
    font-size: 13px;
    margin: 0;
  }
  .auth-story .road-art,
  .auth-story .story-bottom {
    display: none;
  }
  .auth-form {
    padding: 30px 24px;
  }
  .shell {
    display: block;
  }
  .sidebar {
    position: static;
    width: 100%;
    height: auto;
    padding: 14px 20px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .sidebar .brand {
    margin-bottom: 17px;
  }
  .sidebar .nav-title,
  .sidebar-bottom {
    display: none;
  }
  .nav {
    display: flex;
    gap: 4px;
    overflow: auto;
  }
  .nav button {
    padding: 10px;
    font-size: 12px;
    white-space: nowrap;
  }
  .main {
    display: block;
  }
  .topbar {
    padding: 15px 20px;
  }
  .content {
    padding: 25px 20px;
  }
  .welcome {
    align-items: flex-start;
  }
  .welcome h1 {
    font-size: 28px;
  }
  .stats {
    gap: 8px;
  }
  .stat {
    padding: 14px 10px;
    display: block;
  }
  .stat .icon {
    display: none;
  }
  .stat strong {
    font-size: 22px;
  }
  .stat span {
    font-size: 10px;
  }
  .right-column {
    display: block;
  }
  .right-column > .card {
    margin-bottom: 20px;
  }
  .card {
    padding: 20px;
  }
  .grid2 {
    grid-template-columns: 1fr;
  }
  .pricing {
    grid-template-columns: 1fr;
  }
  .premium-page {
    padding: 25px 20px;
  }
  .footer {
    flex-wrap: wrap;
  }
  .breadcrumb {
    font-size: 10px;
  }
  .vehicle-meta strong {
    font-size: 12px;
  }
  .vehicle-meta small {
    font-size: 9px;

      toast("Tu veh\xEDculo ya tiene un lugar en el garaje.");
    });
  }
  function mask(input) {
    input.addEventListener("beforeinput", (e) => {
      if (e.inputType === "insertText" && e.data && !/^\d+$/.test(e.data))
        e.preventDefault();
    });
    input.addEventListener("paste", (e) => {
      const t = e.clipboardData.getData("text");
      if (!/^\d{1,6}$|^\d{1,3}(\.\d{3})+$/.test(t.trim())) {
        e.preventDefault();
        toast("Pega un kilometraje entero, sin negativos ni decimales.");
      }
    });
    input.addEventListener("input", () => {
      const digits = input.value.replaceAll(".", "");
      if (!/^\d*$/.test(digits)) {
        input.setCustomValidity("Usa solo n\xFAmeros enteros.");
        return;
      }
      input.setCustomValidity(digits.length > 6 ? "M\xE1ximo 999.999 km." : "");
      if (digits.length <= 6)
        input.value = digits ? formatKm(Number(digits)) : "";
    });
  }
  function bindForm(selector, fn) {
    $(selector).onsubmit = async (e) => {
      e.preventDefault();
      const b = e.target.querySelector("[type=submit]");
      b.disabled = true;
      $("#form-error").textContent = "";
      try {
        await fn(e.target);
      } catch (e2) {
        if ($("#form-error")) $("#form-error").textContent = e2.message;
        else fail(e2);
      } finally {
        b.disabled = false;
      }
    };
  }
  function mileageForm() {
    const v = vehicle();
    requirePremium();
    openModal(
      "Actualizar kilometraje",
      `<p class="muted">${esc(v.brand)} ${esc(v.model)} \xB7 Actual: ${formatKm(v.mileage)} km</p><form id="mileage-form"><label for="mileage">Nuevo kilometraje</label><input class="input" id="mileage" name="mileage" inputmode="numeric" required maxlength="7" value="${formatKm(v.mileage)}"><p class="help">El od\xF3metro no puede disminuir.</p><p class="error" id="form-error" role="alert"></p><div class="modal-footer"><button class="btn" type="button" data-action="close">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`
    );
    mask($("#mileage"));
    bindForm("#mileage-form", async (f) => {
      await API.updateMileage(v.id, parseMileage(new FormData(f).get("mileage")));
      plan = null;
      modal.close();
      await load();
      toast("Kilometraje actualizado. Genera un nuevo plan.");
    });
  }
  var categories = [
    "Aceite y filtro",
    "Transmisi\xF3n y cadena",
    "Frenos y neum\xE1ticos",
    "Filtro de aire y buj\xEDa",
    "Filtro de aire y habit\xE1culo",
    "Refrigeraci\xF3n y correas",
    "Bater\xEDa y sistema el\xE9ctrico",
    "Revisi\xF3n general",
    "Otro servicio"
  ];
  function recordForm() {
    requirePremium();
    const v = vehicle();
    if (!v) return vehicleForm();
    openModal(
      "Cada servicio cuenta",
      `<p class="muted">${esc(v.brand)} ${esc(v.model)} \xB7 Guarda los detalles de la mantenci\xF3n.</p><form id="record-form"><div class="field"><label for="category">Servicio realizado</label><select id="category" name="category" required>${categories.map((c) => `<option>${c}</option>`).join("")}</select></div><div class="grid2"><div class="field"><label for="service-date">Fecha del servicio</label><input class="input" type="date" id="service-date" name="service_date" required min="${v.year}-01-01" max="${today()}" value="${today()}"></div><div class="field"><label for="mileage">Kilometraje del servicio</label><input class="input" id="mileage" name="mileage" inputmode="numeric" maxlength="7" required value="${formatKm(v.mileage)}"></div></div><div class="grid2"><div class="field"><label for="cost">Costo total (CLP)</label><input class="input" id="cost" name="cost" type="number" min="0" max="99999999" step="1" required placeholder="Ej. 45000"></div><div class="field"><label for="workshop">Taller (opcional)</label><input class="input" id="workshop" name="workshop" maxlength="100" placeholder="Nombre del taller"></div></div><div class="field"><label for="notes">Detalles (opcional)</label><textarea id="notes" name="notes" maxlength="1500" rows="3" placeholder="Repuestos, observaciones o recomendaciones del taller"></textarea></div><p class="help">Si el servicio tiene m\xE1s kil\xF3metros que el od\xF3metro registrado, se actualizar\xE1 el veh\xEDculo. Los servicios hist\xF3ricos no lo disminuyen.</p><p class="error" id="form-error" role="alert"></p><div class="modal-footer"><button class="btn" type="button" data-action="close">Cancelar</button><button class="btn primary" type="submit">Guardar mantenci\xF3n</button></div></form>`
    );
    mask($("#mileage"));
    bindForm("#record-form", async (f) => {
      const d = new FormData(f), cost = Number(d.get("cost")), day = d.get("service_date");
      if (!Number.isInteger(cost) || cost < 0 || cost > 99999999)
        throw new Error("Costo inv\xE1lido.");
      if (day < `${v.year}-01-01` || day > today())
        throw new Error("Selecciona una fecha entre el a\xF1o del veh\xEDculo y hoy.");
      await API.addRecord(v.id, {
        category: d.get("category"),
        service_date: day,
        mileage: parseMileage(d.get("mileage")),
        cost,
        workshop: d.get("workshop").trim(),
        notes: d.get("notes").trim()
      });
      plan = null;
      modal.close();
      await load();
      toast("Mantenci\xF3n registrada. Tu historial est\xE1 al d\xEDa.");
    });
  }
  function confirmDialog(title, text, action) {
    openModal(
      title,
      `<p class="muted">${esc(text)}</p><div class="modal-footer"><button class="btn" data-action="close">Cancelar</button><button class="btn danger" id="confirm-delete">S\xED, eliminar</button></div>`
    );
    $("#confirm-delete").onclick = async (e) => {
      e.target.disabled = true;
      try {
        await action();
        modal.close();
        plan = null;
        await load();
        toast("El registro se elimin\xF3.");
      } catch (e2) {
        fail(e2);
        $("#confirm-delete").disabled = false;
      }
    };
  }
  function renderRecovery() {
    shell(
      '<section class="card" style="max-width:500px"><h2>Elige una nueva contrase\xF1a</h2><form id="recovery-form"><label for="new-password">Nueva contrase\xF1a</label><input id="new-password" name="password" class="input" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><p class="error" id="form-error" role="alert"></p><button type="submit" class="btn primary">Guardar contrase\xF1a</button></form></section>'
    );
    bindForm("#recovery-form", async (f) => {
      await API.changePassword(new FormData(f).get("password"));
      recovery = false;
      await load();
      toast("Contrase\xF1a actualizada.");
    });
  }
  function exportCSV() {
    const rows = [
      ["Servicio", "Fecha", "Kilometraje", "Costo CLP", "Taller", "Notas"],
      ...records.map((r) => [
        r.category,
        r.service_date,
        r.mileage,
        r.cost,
        r.workshop,
        r.notes
      ])
    ];
    const safe = (x) => {
      let s = String(x ?? "");
      if (/^[\s]*[=+@-]/.test(s)) s = "'" + s;
      return '"' + s.replaceAll('"', '""') + '"';
    };
    const blob = new Blob(
      ["\uFEFF" + rows.map((r) => r.map(safe).join(";")).join("\r\n")],
      { type: "text/csv;charset=utf-8;" }
    );
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url;
    a.download = "bitacora-garaje.csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1e3);
  }
  async function load() {
    const ticket = ++loadVersion;
    const [p, vs] = await Promise.all([API.profile(), API.vehicles()]);
    if (ticket !== loadVersion) return;
    profile = p;
    vehicles = vs;
    if (!vehicles.some((v) => v.id === selected))
      selected = vehicles[0]?.id || null;
    const rs = selected ? await API.records(selected) : [];
    if (ticket !== loadVersion) return;
    records = rs;
    render();
  }
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    try {
      if (b.dataset.auth) {
        authMode = b.dataset.auth;
        renderAuth();
        return;
      }
      if (b.dataset.oauth) {
        b.disabled = true;
        try {
          await API.oauth(b.dataset.oauth);
        } finally {
          b.disabled = false;
        }
        return;
      }
      if (b.dataset.view) {
        view = b.dataset.view;
        render();
        return;
      }
      if (b.dataset.vehicle || b.dataset.openVehicle) {
        selected = b.dataset.vehicle || b.dataset.openVehicle;
        if (b.dataset.openVehicle) view = "dashboard";
        plan = null;
        await load();
        return;
      }
      if (b.dataset.deleteVehicle) {
        const id = b.dataset.deleteVehicle;
        confirmDialog(
          "Eliminar veh\xEDculo",
          "Se eliminar\xE1n el veh\xEDculo y todas sus mantenciones. Esta acci\xF3n no se puede deshacer.",
          () => API.removeVehicle(id)
        );
        return;
      }
      if (b.dataset.deleteRecord) {
        confirmDialog(
          "Eliminar mantenci\xF3n",
          "Se eliminar\xE1 este servicio. El kilometraje actual del veh\xEDculo se conservar\xE1.",
          () => API.removeRecord(b.dataset.deleteRecord)
        );
        return;
      }
      switch (b.dataset.action) {
        case "theme":
          theme();
          break;
        case "close":
          modal.close();
          break;
        case "logout":
          await API.signOut();
          user = null;
          profile = null;
          vehicles = [];
          records = [];
          selected = null;
          plan = null;
          recovery = false;
          ++loadVersion;
          view = "dashboard";
          if (modal.open) modal.close();
          render();
          break;
        case "subscribe":
          b.disabled = true;
          try {
            await API.subscribe();
            view = "dashboard";
            await load();
            toast(
              "Prueba activada por 30 d\xEDas. No se ha realizado ning\xFAn cobro."
            );
          } finally {
            b.disabled = false;
          }
          break;
        case "add-vehicle":
          vehicleForm();
          break;
        case "mileage":
          mileageForm();
          break;
        case "add-record":
          recordForm();
          break;
        case "generate": {
          requirePremium();
          const v = vehicle();
          if (!v) return;
          const id = v.id, version = loadVersion;
          generating = true;
          render();
          try {
            const next = await API.plan(v, records);
            if (user && selected === id && version === loadVersion) {
              plan = next;
              toast(
                API.demo ? "Plan de referencia generado." : "An\xE1lisis de IA generado."
              );
            }
          } finally {
            generating = false;
            render();
          }
          break;
        }
        case "export":
          exportCSV();
          break;
        case "forgot": {
          const email = $("#email")?.value;
          if (!email || !$("#email").checkValidity())
            throw new Error("Escribe primero un correo v\xE1lido en el formulario.");
          await API.reset(email);
          toast("Si la cuenta existe, recibir\xE1s un enlace de recuperaci\xF3n.");
          break;
        }
        case "privacy":
          openModal(
            "Privacidad y condiciones",
            `<p>Garaje Premium es una aplicaci\xF3n de seguimiento de mantenciones. Los planes orientativos no sustituyen el manual del fabricante ni una evaluaci\xF3n mec\xE1nica.</p><p>En modo demo, los datos permanecen en este navegador. No se realizan cobros ni se env\xEDan correos. Evita datos personales reales.</p><p>Al conectar Supabase, los datos de cuenta, veh\xEDculos y servicios se almacenan en tu proyecto. Al generar un an\xE1lisis de IA, se env\xEDan al proveedor el tipo, marca, modelo, a\xF1o, kilometraje y categor\xEDas de servicios; no el correo, nombre, taller ni notas libres.</p><p>La suscripci\xF3n disponible es una simulaci\xF3n de 30 d\xEDas, sin renovaci\xF3n. La pol\xEDtica comercial, identidad del responsable y pol\xEDtica de privacidad definitiva deben configurarse antes de ofrecer el servicio al p\xFAblico.</p><button class="btn full" data-action="close">Entendido</button>`
          );
          break;
      }
    } catch (e2) {
      fail(e2);
    }
  });
  modal.addEventListener("click", (e) => {
    if (e.target === modal) {
      const r = modal.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)
        modal.close();
    }
  });
  window.addEventListener("storage", async (e) => {
    if (API.demo && e.key === "garaje-premium-demo-v1") {
      try {
        user = await API.session();
        plan = null;
        if (user) await load();
        else render();
      } catch (e2) {
        fail(e2);
      }
    }
  });
  async function start() {
    try {
      user = await API.init();
      API.onAuth(async (event) => {
        try {
          user = await API.session();
          if (event === "PASSWORD_RECOVERY") recovery = true;
          if (!user) {
            ++loadVersion;
            profile = null;
            vehicles = [];
            records = [];
            selected = null;
            plan = null;
            view = "dashboard";
            render();
          } else await load();
        } catch (e) {
          fail(e);
        }
      });
      if (user) await load();
      else render();
    } catch (e) {
      app.innerHTML = `<main class="loading"><section class="card" style="max-width:520px;margin:20px"><h2>Falta un paso de configuraci\xF3n</h2><p>${esc(e.message)}</p><p class="muted">Revisa config.js y las instrucciones del README. La aplicaci\xF3n no permite entrar sin una sesi\xF3n v\xE1lida.</p><button class="btn primary" data-action="reload">Volver a intentar</button></section></main>`;
      app.querySelector("button").onclick = () => location.reload();
    }
  }
  start();
})();
</script></body></html>
